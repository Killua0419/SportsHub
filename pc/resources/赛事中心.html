function courtShotStat(g, period){
  const shots=(g.shots||[]).filter(s=> period==null || Number(s.period)===Number(period));
  return { made:shots.filter(s=>s.made).length, miss:shots.filter(s=>!s.made).length };
}
/* 球场下方节次下拉切换 → 场地缩略图按该节筛选点位与命中/未中统计；选全场回到全部 */
function refreshCourt(host, g){
  const c=$('#court-host'); if(!c) return;
  c.innerHTML=courtSvg(g, courtPeriod);
  const cfg=SPORT_CFG[g.sport]||SPORT_CFG.basketball;
  const label=courtPeriod==null?t('court.all'):cfg.groupTitle(courtPeriod);
  const stat=courtShotStat(g,courtPeriod);
  const pm=host.querySelector('.court-period'); if(pm) pm.textContent=label;
  const hm=host.querySelector('.court-hit'); if(hm) hm.textContent=t('court.shotStat',{made:stat.made,miss:stat.miss});
}
function shotsHtml(g, period){
  /* ESPN 篮球为单筐半场平面坐标：x 横跨 0–50（中线 x=25），y 从筐向中场的纵深(ft)；两队同视角。
     场地几何与 courtBasketball 同一套 英尺→像素 变换：纵深沿水平、横跨沿垂直。 */
  const shots=(g.shots||[]).filter(s=> period==null || Number(s.period)===Number(period));
  const isBasket = g.sport==='basketball';
  const X0=18, XMID=300, X1=582, YMID=160, TOP=24, BOT=296;
  const scaleX=(XMID-X0)/47, scaleY=(BOT-TOP)/50, basketZ=5.25;
  return shots.map(s=>{
    const x=Number(s.x), y=Number(s.y);
    if(isNaN(x)||isNaN(y)) return '';
    const isHome=s.side!=='away';
    const color=isHome?(g.home.color||'#3B82F6'):(g.away.color||'#F472B6');
    let px, py;
    if(isBasket){
      const off=x-25;
      if(off<-25||off>25||y<-3||y>42) return '';
      const z=basketZ+Math.max(0,y);
      py=YMID+off*scaleY;
      px=isHome ? X0+z*scaleX : X1-z*scaleX;
      px=Math.max(isHome?X0:XMID, Math.min(isHome?XMID:X1, px));
      py=Math.max(TOP, Math.min(BOT, py));
    } else {
      const baseX=isHome?18:312, w=270;
      px=baseX+(x/50)*w; py=24+(y/47)*272;
    }
    if(s.made) return `<circle cx="${px}" cy="${py}" r="5" fill="${color}" fill-opacity=".95" stroke="rgba(255,255,255,.4)" stroke-width="1"/>`;
    return `<circle cx="${px}" cy="${py}" r="5" fill="none" stroke="${color}" stroke-opacity=".75" stroke-width="1.5"/><text x="${px}" y="${py+3.5}" text-anchor="middle" fill="${color}" font-size="11" font-weight="800">✕</text>`;
  }).join('');
}
function possessionHtml(g){
  if (g.status!=='live') return '';
  const homeSide = g.possession==='home';
  const holder = g.possessionPlayer;
  const holderLabel = holder && holder.num ? `${esc(holder.num)}号 ${esc(holder.name)} 持球` : '';
  /* 归一化坐标 pos{x,y}（0-100）映射到 SVG 600×320；按所属半场钳制边界，无坐标回退固定点 */
  let cx, cy;
  if (holder && holder.pos){
    const x = Math.max(0, Math.min(100, holder.pos.x)), y = Math.max(0, Math.min(100, holder.pos.y));
    const px = x/100*600, py = y/100*320;
    cx = homeSide ? Math.max(50, Math.min(280, px)) : Math.max(320, Math.min(550, px));
    cy = Math.max(60, Math.min(260, py));
  } else {
    cx = homeSide ? 120 : 480; cy = 160;
  }
  const dir = homeSide ? -1 : 1;
  const labelY = Math.min(cy+32, 292);
  return `

  }

function _formRate(team){

    : [ [win,0.40], [form,0.15], [rank,0.15], [roster,0.10], [_injuryFactor(),0.06], [_b2bFactor(),0.04], [_divisionFactor(),0.05], [_playerFormFactor(),0.05] ];

/* 技术统计表：独立渲染，表头排序只局部重绘本表，不联动动作流折叠状态 */
function _sortVal(r,k){
  if(k==='name') return String(r.name||'');
  if(k==='eff'){ const e=_effVal(r); const n=parseFloat(e); return isNaN(n)?0:n; }
  return _statNum(r,k)||parseFloat(_statRaw(r,k))||0;
}
function _sortRows(rows){
  const k=state.statSort.k, dir=state.statSort.dir==='desc'?-1:1;
  const isTotal=r=>!!(r.isTotal||r.name==='统计'||r.name==='合计'||r.name==='总分');
  const total=rows.filter(isTotal);
  const rest=rows.filter(r=>!isTotal(r));
  const sorted=rest.slice().sort((a,b)=>{
    if(k==='name') return String(a.name||'').localeCompare(String(b.name||''),'zh-Hans-CN')*dir;
    if(k){ const d=_sortVal(a,k)-_sortVal(b,k); return d===0?String(a.name||'').localeCompare(String(b.name||''),'zh-Hans-CN'):d*dir; }
    return String(a.name||'').localeCompare(String(b.name||''),'zh-Hans-CN');
  });
  return sorted.concat(total);
}
function _statTable(cols, rows){
  const statHead=cols.map(c=>{
    const active=state.statSort.k===c.k;
    const arrow=active?(state.statSort.dir==='desc'?'▼':'▲'):'';
    return `<th class="sortable${active?' on':''}" data-stat="${c.k}">${t(c.label)}${arrow?` <span class="num">${arrow}</span>`:''}</th>`;
  }).join('');
  const nameActive=state.statSort.k==='name';
  const nameArrow=nameActive?(state.statSort.dir==='desc'?'▼':'▲'):'';
  const nameTh=`<th class="sortable${nameActive?' on':''}" data-stat="name">${t('table.player')}${nameArrow?` <span class="num">${nameArrow}</span>`:''}</th>`;
  return `<div class="table-wrap stat-table">
    <table>
      <colgroup><col style="width:26%">${cols.map(()=>'<col class="c-num">').join('')}</colgroup>
      <thead><tr>${nameTh}${statHead}</tr></thead>
      <tbody>
        ${rows.map(r=>{
          const tc=r.isTotal||r.name==='统计'||r.name==='合计'||r.name==='总分';
          return `<tr class="${tc?'stat-total':'row-hover'}">
            <td class="team-cell">${r.num?`<span class="p-num">${esc(r.num)}</span>`:''}<span>${esc(r.name)}</span></td>
            ${cols.map(c=>`<td class="num">${_statCell(r,c.k)}</td>`).join('')}
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}
function _statGroupTitle(team, side){
  const tagCls = side==='home' ? 'status-upcoming' : 'status-done';
  const tagText = side==='home' ? t('team.home') : t('team.away');
  const logo = team.logo ? `<img class="g-logo" src="${esc(team.logo)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  return `<div class="stat-group-title">${logo}<span>${esc(team.name||'—')}</span><span class="g-tag ${tagCls}">${tagText}</span></div>`;
}
function statsHtmlFor(g, upcoming){
  const cfg=SPORT_CFG[g.sport]||SPORT_CFG.basketball;
  const cols=cfg.statsCols;
  if(upcoming) return `<div class="empty-tip">比赛未开始，技术数据将在开赛后实时更新</div>`;
  /* 篮球按主队 / 客队分组；其他运动沿用合并一张表 */
  if(g.sport==='basketball'){
    const homeRows=_sortRows(g.home.roster||[]);
    const awayRows=_sortRows(g.away.roster||[]);
    if(!homeRows.length && !awayRows.length) return `<div class="empty-tip">${esc(t('league.noData'))}</div>`;
    return `<div class="stat-groups">
      ${homeRows.length?`<div class="stat-group">${_statGroupTitle(g.home,'home')}${_statTable(cols,homeRows)}</div>`:''}
      ${awayRows.length?`<div class="stat-group">${_statGroupTitle(g.away,'away')}${_statTable(cols,awayRows)}</div>`:''}
    </div>`;
  }
  const allRows=(g.home.roster||[]).concat(g.away.roster||[]);
  return _statTable(cols, _sortRows(allRows));
}
function eventWindowActive(meta){
  const now=new Date();
  const pad=7*24*3600*1000;
  const sKey=meta.specialStart||meta.startDate, eKey=meta.specialEnd||meta.endDate;
  if(sKey){ const s=new Date(sKey+'T00:00:00+08:00'); if(now < s-pad) return false; }
  if(eKey){ const e=new Date(eKey+'T23:59:59+08:00'); if(now > e) return false; }
  return true;
}
function specialEventVisible(meta, detail){
  if(detail.bracket) return true;
  if(!meta.special) return false;
  if(meta.specialStart||meta.specialEnd||meta.startDate||meta.endDate) return eventWindowActive(meta);
  return false;
}

const flowCollapsed = Object.assign({}, Coll.bag('flow'));
const flowOlder = Object.assign({}, Coll.bag('older'));
const FLOW_RECENT = 8;
/* 场地缩略图当前筛选的节次；null 表示全场 */
let courtPeriod = null;

function groupPlays(plays){
  const map = {};
  (plays||[]).forEach(p=>{ (map[p.period]=map[p.period]||[]).push(p); });
  return Object.keys(map).map(Number).sort((a,b)=>b-a).map(period=>({period, items:map[period]}));
}
const cardCollapsed = Object.assign({}, Coll.bag('cards'));
function playKey(p){ return `${p.period}|${p.clock}|${p.desc}`; }
const RESULT_LABEL_KEY = { made:'flow.res.made', miss:'flow.res.miss', assist:'flow.res.assist', steal:'flow.res.steal', rebound:'flow.res.rebound', foul:'flow.res.foul', sub:'flow.res.sub', timeout:'flow.res.timeout', turnover:'flow.res.turnover', block:'flow.res.block', violation:'flow.res.violation', other:'flow.res.other' };
function playRowHtml(g, p){
  const meta = PLAY_META[p.result] || PLAY_META.rebound;
  const clickable = p.detail || p.playerCard;
  const rowCls = `play-row${clickable?' clickable':''}`;
  const label = p.label || t(RESULT_LABEL_KEY[p.result]||'flow.res.rebound');
  /* 中文界面优先用规则化中文动作描述；英文界面保留 ESPN 原文；团队事件队名占位在此替换 */
  const isZh = (Store.settings.uiLang||'zh-CN')!=='en';
  const _teamName = side => g[side] ? tn(g[side].name) : '';
  let descText = isZh ? (p.descZh || p.desc) : p.desc;
  if(descText) descText = descText.replace(/§HOME§/g, _teamName('home')).replace(/§AWAY§/g, _teamName('away'));
  /* 桌球：单球分值 + 单杆累计；犯规：获分方总分 */
  let sub = '';
  if (p.ballValue!=null) sub = `<span class="play-sub">+${p.ballValue} · 单杆累计 ${p.running}</span>`;
  if (p.foulTo) sub = `<span class="play-sub">罚分 · ${p.foulTo.side==='home'?esc(g.home.name):esc(g.away.name)} 总分 ${p.foulTo.total}</span>`;
  if (p.actor && p.actor.name) sub += `<span class="play-sub">${esc(p.actor.num?p.actor.num+'号 ':'')}${esc(tn(p.actor.name))}</span>`;
  /* 电竞：队员数据折叠卡 */
  let card = '';
  if (p.playerCard){
    const pc = p.playerCard;
    const open = !!cardCollapsed[playKey(p)];
    card = `
    <div class="player-card ${open?'':'collapsed'}">
      <div class="pc-row"><b>${esc(pc.num)}号 ${esc(pc.name)}</b><span class="num">KDA ${esc(pc.kda)}</span></div>
      <div class="pc-grid"><span>经济 ${esc(pc.gold)}</span><span>补刀 ${esc(pc.cs)}</span><span>参团率 ${esc(pc.part)}</span></div>
    </div>`;
  }
  const detailAttr = p.detail ? `data-detail="${esc(playKey(p))}"` : '';
  const cardAttr = p.playerCard ? `data-card="${esc(playKey(p))}"` : '';
  return `
  <div class="${rowCls}" ${detailAttr} ${cardAttr}>
    <span class="play-clock num">${esc(p.clock)}</span>
    <span class="play-icon" style="color:${meta.color}">${PLAY_ICONS[meta.icon]}</span>
    <span class="play-main"><span class="play-desc">${esc(descText)}</span>${sub}</span>
    <span class="play-tag" style="color:${meta.color};background:${meta.color}1F;border-color:${meta.color}55">${esc(label)}</span>
  </div>${card}`;
}
function playFlowHtml(g){
  const groups = groupPlays(g.plays);
  if (!groups.length){
    const tip = g.status==='upcoming' ? t('flow.emptyUpcoming')
      : g.status==='done' ? t('flow.emptyDone')
      : t('flow.emptyLive');
    return `<div class="empty-tip">${tip}</div>`;
  }
  const cfg = SPORT_CFG[g.sport] || SPORT_CFG.basketball;
  return groups.map(gr=>{
    const collapsed = !!flowCollapsed[gr.period];
    const olderOpen = !!flowOlder[gr.period];
    const items = gr.items;
    const older = items.slice(0, Math.max(0, items.length-FLOW_RECENT)).reverse();
    const recent = items.slice(-FLOW_RECENT).reverse();
    const olderBlock = older.length? `
      <div class="flow-older ${olderOpen?'':'collapsed'}">${older.map(p=>playRowHtml(g,p)).join('')}</div>
      <button class="older-toggle" data-older="${gr.period}" type="button">${olderOpen? t('flow.less') : t('flow.more',{n:older.length})}</button>` : '';
    return `
    <div class="flow-group">
      <button class="flow-head" data-period="${gr.period}">
        <span class="flow-head-title">${cfg.groupTitle(gr.period)}</span>
        <span class="flow-head-meta num">${t('flow.count',{n:gr.items.length})}</span>
        <svg class="flow-arrow ${collapsed?'':'open'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="flow-body ${collapsed?'collapsed':''}">
        ${recent.map(p=>playRowHtml(g,p)).join('')}
        ${olderBlock}
      </div>
    </div>`;
  }).join('');
}
function bindFlow(host, g){
  host.querySelectorAll('.flow-head').forEach(head=>{
    head.addEventListener('click', ()=>{
      const period = Number(head.dataset.period);
      flowCollapsed[period] = !flowCollapsed[period];
      Coll.set('flow', period, flowCollapsed[period]);
      /* 动作流折叠/展开不再联动球场缩略图投点；节次筛选改由球场下方下拉控件控制 */
      $('#flow-host').innerHTML = playFlowHtml(g);
      bindFlow(host, g);
    });
  });
  host.querySelectorAll('[data-older]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const period = Number(btn.dataset.older);
      flowOlder[period] = !flowOlder[period];
      Coll.set('older', period, flowOlder[period]);
      $('#flow-host').innerHTML = playFlowHtml(g);
      bindFlow(host, g);
    });
  });
  /* 电竞：队员数据卡折叠 */
  host.querySelectorAll('[data-card]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const k = row.dataset.card;
      cardCollapsed[k] = !cardCollapsed[k];
      Coll.set('cards', k, cardCollapsed[k]);
      $('#flow-host').innerHTML = playFlowHtml(g);
      bindFlow(host, g);
    });
  });
  /* 足球：进球/助攻球员弹窗 */
  host.querySelectorAll('[data-detail]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const p = (g.plays||[]).find(x=>playKey(x)===row.dataset.detail);
      if (!p || !p.detail) return;
      const d = p.detail;
      const mask = $('#detail-mask');
      mask.innerHTML = `
        <div class="detail-pop">
          <div class="pop-head"><span class="pop-num">${esc(d.num)}</span><div><div class="pop-name">${esc(d.name)}</div><div class="pop-pos">${esc(d.pos)} · ${esc(d.clock)}</div></div></div>
          <div class="pop-line">${esc(d.note)}</div>
          <div class="pop-line">${esc(d.assist)}</div>
          <div class="pop-line dim">${esc(d.line)}</div>
        </div>`;
      mask.classList.remove('hidden');
    });
  });
}
/* 当前比赛详情轮询定时器；离开比赛页或切换比赛时清除 */
let pollTimer = null;
function stopPoll(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

let gameReq = 0;
async function renderGame(gameId){
  stopPoll();
  const my = ++gameReq;
  const g = await SportsProvider.getGame(gameId);
  if (my !== gameReq) return;
  const host = $('#game-detail');
  if (!g){ host.innerHTML = `<div class="empty-tip">${esc(t('league.noData'))}</div>`; return; }
  pushHistory('game', gameId, `${g.home.name} vs ${g.away.name}`);
  recordRef(g);
  /* 折叠状态跨比赛保留：仅对还没有记忆的节次给默认值（最新节展开，其余收起），不主动清空用户手动操作过的状态 */
  courtPeriod = null;
  const upcoming = g.status==='upcoming';
  const periods = groupPlays(g.plays).map(x=>x.period);
  periods.forEach((p,i)=>{ if(!Object.prototype.hasOwnProperty.call(flowCollapsed,p)) flowCollapsed[p] = i!==0; });
  const done = g.status==='done';
  const dptC = primaryTime(g);
  const localTzHtml = (g.localTz==='Asia/Shanghai') ? '' : locTimeHtml(g);
  const clockText = upcoming
    ? `${esc(dptC?[dptC.datePart,dptC.time].filter(Boolean).join(' '):gameDateLabel(g))}${localTzHtml?`（${localTzHtml}）`:''}`
    : done ? '全场结束' : `${esc(g.quarter)} · ${esc(g.clock)}`;

  const cfg = SPORT_CFG[g.sport] || SPORT_CFG.basketball;
  const statsHtml = statsHtmlFor(g, upcoming);

  const lgMeta = LEAGUES[g.leagueId] || {};
  const simple = !!lgMeta.simple;
  const isTennis = g.sport==='tennis';
  const st = statusMeta(g);

  const courtStat = courtShotStat(g, courtPeriod);
  const courtPeriodLabel = courtPeriod==null ? t('court.all') : (SPORT_CFG[g.sport]||SPORT_CFG.basketball).groupTitle(courtPeriod);
  const courtPeriods = [...new Set((g.shots||[]).map(s=>Number(s.period)).filter(Boolean))].sort((a,b)=>a-b);
  /* 篮球详情顶部信息块：队标 / 比分 / 队名，场地缩略图下移到此块之下 */
  const noScore = !g.score || g.score.home==null || g.score.away==null;
  const headScore = (upcoming || noScore) ? `<span class="vs">VS</span>` : `<span class="num">${g.score.home} : ${g.score.away}</span>`;
  const homeFid = teamFollowId(g.home.name), awayFid = teamFollowId(g.away.name);
  const homeStar = `<button class="star-btn ${isFollowing('team',homeFid)?'active':''}" data-follow-team="home" title="关注球队" type="button">★</button>`;
  const awayStar = `<button class="star-btn ${isFollowing('team',awayFid)?'active':''}" data-follow-team="away" title="关注球队" type="button">★</button>`;
  const headBlock = (g.sport==='basketball' && !simple) ? `
    <div class="det-head">
      <div class="dh-teams">
        <div class="team home">${logoHtml(g.home)}<div class="team-meta"><span class="team-line">${badgeHtml(g.home.abbr,g.home.color)}${teamNameHtml(g.home.name)}</span>${homeStar}</div></div>
        <div class="dh-score">${headScore}</div>
        <div class="team away"><div class="team-meta"><span class="team-line">${badgeHtml(g.away.abbr,g.away.color)}${teamNameHtml(g.away.name)}</span>${awayStar}</div>${logoHtml(g.away)}</div>
      </div>
      <div class="dh-meta"><span class="gc-status ${st.cls}">${st.text}</span></div>
    </div>` : '';
  const courtBlock = simple ? '' : `
    <div class="court-card">
      <div id="court-host">${courtSvg(g, courtPeriod)}</div>
      <div class="court-meta">
        <span class="clock num">${clockText}</span>
        <select id="court-period-select" class="court-select" aria-label="${t('court.all')}">
          <option value="" ${courtPeriod==null?'selected':''}>${t('court.all')}</option>
          ${courtPeriods.map(p=>`<option value="${p}" ${courtPeriod===p?'selected':''}>${cfg.groupTitle(p)}</option>`).join('')}
        </select>
        <span class="court-hit num">${t('court.shotStat',{made:courtStat.made,miss:courtStat.miss})}</span>
        ${done?'':`<span class="eta">${esc(g.eta)}</span>`}
      </div>
    </div>`;
  const flowBlock = (simple || isTennis) ? '' : `
    <div class="detail-block">
      <h3>${t('detail.flow')}</h3>
      <div id="flow-host">${playFlowHtml(g)}</div>
    </div>`;
  const formBlock = (simple || isTennis) ? '' : `
    <div class="detail-block">

  host.querySelectorAll('[data-follow-team]').forEach(b=>b.addEventListener('click',()=>{

  if (g.status === 'live'){

      if (!location.hash.startsWith('#/game/'+gameId)){ stopPoll(); return; }

  const mask = $('#detail-mask');

/* 关注：名称归一化与匹配（跨源 teamId 体系不一致，按宽松队名匹配） */
function followNorm(n){ return String(n||'').replace(/\s+/g,'').replace(/(俱乐部|篮球队|男篮|女篮|队)$/,''); }
function teamFollowId(name){ return followNorm(name); }
function playerFollowId(team, name){ return followNorm(team)+'|'+followNorm(name); }
function followNameMatch(a, b){
  const x = followNorm(a), y = followNorm(b);
  return !!x && !!y && (x.includes(y) || y.includes(x));
}
function followedTeams(){ return Store.follows.filter(f=>f.type==='team'); }
function isFollowing(type, id){ return Store.follows.some(f=>f.type===type && f.id===id); }
function toggleFollow(type, id, name, sub){
  let list = Store.follows;
  const hit = f => f.type===type && f.id===id;
  if (list.some(hit)){ list = list.filter(f=>!hit(f)); toast(t('toast.unfollowed')); }
  else { list.push({ type, id, name, sub:sub||'', ts:Date.now() }); toast(t('toast.followed')); }
  Store.follows = list;
}
function pushHistory(kind, id, name){
  let list = Store.history.filter(h=>!(h.kind===kind && h.id===id));
  list.unshift({ kind, id, name, ts:Date.now() });
  Store.history = list.slice(0, 30);
}
function clearHistory(){ Store.history = []; }

      <div id="source-list">${draft.map(sourceRow).join('')}</div>
      <button class="mini-btn" id="add-source" style="margin-top:10px">${t('settings.addSource')}</button>
      <div class="src-actions">
        <button class="mini-btn primary" id="src-save" type="button">${t('src.save')}</button>
        <button class="mini-btn" id="src-discard" type="button">${t('src.discard')}</button>
      </div>
    </div>`;
  $('#settings-body').innerHTML = tabs + (settingsTab==='sources'?sourcesHtml:generalHtml);
  bindSettings($('#settings-body'));
}
function bindSettings(body){
  body.querySelectorAll('[data-setting]').forEach(seg=>{
    const key = seg.dataset.setting;
    if (key === 'lite'){
      seg.addEventListener('click', ()=>{ const s=Store.settings; s.lite=!s.lite; Store.settings=s; renderSettings(); });
      return;
    }
    if (seg.tagName === 'SELECT'){
      seg.addEventListener('change', ()=>{
        const s=Store.settings; s[key]=seg.value; Store.settings=s;
        if (key==='theme') applyTheme();
        renderSettings(); router();
      });
      return;
    }
    if (seg.tagName === 'INPUT' && seg.type === 'text'){
      seg.addEventListener('change', ()=>{
        const s=Store.settings; s.proxyBase=seg.value.trim(); Store.settings=s; renderSettings();
      });
      return;
    }
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      const s=Store.settings; let v=b.dataset.v;
      if (key==='pollInterval'||key==='cacheMaxGb') v=Number(v);
      s[key]=v; Store.settings=s; renderSettings();
      if (key==='nameLang') router();
    }));
  });
  body.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{
    settingsTab=btn.dataset.tab; renderSettings();
  }));
  /* 数据源为草稿模式：增删改只作用于草稿，点「保存」才写回本机配置 */
  body.querySelectorAll('[data-src-toggle]').forEach(sw=>sw.addEventListener('click',()=>{
    const x=sourceDraft.find(o=>o.id===sw.dataset.srcToggle);
    if(x){ x.enabled=!x.enabled; renderSettings(); }
  }));
  body.querySelectorAll('[data-src-del]').forEach(b=>b.addEventListener('click',()=>{
    sourceDraft=sourceDraft.filter(o=>o.id!==b.dataset.srcDel); renderSettings(); toast(t('toast.sourceDeleted'));
  }));
  body.querySelectorAll('[data-src-field]').forEach(inp=>inp.addEventListener('change',()=>{
    const x=sourceDraft.find(o=>o.id===inp.dataset.id);
    if(x){ x[inp.dataset.srcField]=inp.value; }
  }));
  /* 按联赛主源 / 兜底草稿：主源切换后从兜底列表剔除自身 */
  body.querySelectorAll('[data-pref-primary]').forEach(sel=>sel.addEventListener('change',()=>{
    const lid=sel.dataset.prefPrimary;
    const cur=prefDraft[lid]||{ primary:'', fallbacks:[] };
    cur.primary=sel.value;
    cur.fallbacks=cur.fallbacks.filter(x=>x!==sel.value);
    prefDraft[lid]=cur; renderSettings();
  }));
  body.querySelectorAll('[data-pref-fb]').forEach(cb=>cb.addEventListener('change',()=>{
    const lid=cb.dataset.prefFb, src=cb.dataset.src;
    const cur=prefDraft[lid]||{ primary:'', fallbacks:[] };
    cur.fallbacks=cb.checked?Array.from(new Set(cur.fallbacks.concat([src]))):cur.fallbacks.filter(x=>x!==src);
    prefDraft[lid]=cur;
  }));
  const prefReset=$('#pref-reset'); if(prefReset) prefReset.addEventListener('click',()=>{ prefDraft={}; renderSettings(); });
  const add=$('#add-source'); if(add) add.addEventListener('click',()=>{
    sourceDraft=sourceDraft.concat([{ id:'src-'+Date.now(), name:'', url:'', type:'free', leagueId:'', user:'', pass:'', enabled:true, note:'自定义采集站点' }]);
    renderSettings();
  });
  const save=$('#src-save'); if(save) save.addEventListener('click',()=>{
    Store.sources=sourceDraft.map(x=>({...x}));
    const prefs={};
    Object.keys(prefDraft||{}).forEach(lid=>{
      const p=prefDraft[lid];
      if(p && (p.primary || (p.fallbacks&&p.fallbacks.length))) prefs[lid]={ primary:p.primary||'', fallbacks:p.fallbacks||[] };
    });
    const s=Store.settings; s.sourcePrefs=prefs; Store.settings=s;
    toast(t('src.saved'));
  });
  const discard=$('#src-discard'); if(discard) discard.addEventListener('click',()=>{
    sourceDraft=Store.sources.map(x=>({...x}));
    prefDraft=JSON.parse(JSON.stringify(Store.settings.sourcePrefs||{}));
    renderSettings();
  });
  const cc=$('#settings-clear-cache'); if(cc) cc.addEventListener('click',()=>{ cacheClear(); renderSettings(); toast(t('toast.cacheCleared')); });
  body.querySelectorAll('[data-color]').forEach(sw=>sw.addEventListener('click',()=>applyCustomColor(sw.dataset.color)));
  const ccColor=$('#custom-color');
  if(ccColor) ccColor.addEventListener('change',()=>applyCustomColor(ccColor.value));
}
function openSettings(){
  sourceDraft=Store.sources.map(x=>({...x}));
  prefDraft=JSON.parse(JSON.stringify(Store.settings.sourcePrefs||{}));
  settingsTab='general';
  renderSettings();
  $('#settings-mask').classList.remove('hidden');
}
function closeSettings(){ $('#settings-mask').classList.add('hidden'); }

/* ---------- 背景配色主题 ---------- */
const THEME_PRESETS = {
  default:{ bg1:'#1A1440', bg2:'#2B1B6B', bg3:'#150F33', card:'rgba(255,255,255,.06)', card2:'rgba(255,255,255,.10)', line:'rgba(255,255,255,.12)', text:'#F5F3FF', text2:'#B9B3D9', text3:'#8E87B8' },
  light:  { bg1:'#F7F6FB', bg2:'#EDEAF6', bg3:'#E4E1EE', card:'rgba(26,20,64,.05)',  card2:'rgba(26,20,64,.09)',  line:'rgba(26,20,64,.12)',  text:'#1A1440', text2:'#4A4470', text3:'#76709A' },
  dark:   { bg1:'#0E0E12', bg2:'#17171D', bg3:'#0A0A0E', card:'rgba(255,255,255,.05)', card2:'rgba(255,255,255,.09)', line:'rgba(255,255,255,.12)', text:'#F2F2F5', text2:'#B6B6C2', text3:'#85858F' }
};
function hexRgb(hex){ const h=String(hex||'').replace('#',''); const v=h.length===3?h.split('').map(c=>c+c).join(''):h; const n=parseInt(v||'000000',16); return [n>>16&255,n>>8&255,n&255]; }
function luminance(hex){ const [r,g,b]=hexRgb(hex); return (0.299*r+0.587*g+0.114*b)/255; }
function shade(hex, amt){ const [r,g,b]=hexRgb(hex); const f=amt<0?0:255; const p=Math.abs(amt)/100; const m=c=>Math.round(c+(f-c)*p); return '#'+[m(r),m(g),m(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function applyTheme(){
  const s=Store.settings, root=document.documentElement.style;
  let p;
  if (s.theme==='custom'){
    const bg=s.customBg||'#2A1B4A', dark=luminance(bg)<0.5;
    p={ bg1:bg, bg2:shade(bg, dark?10:-8), bg3:shade(bg,-12),
      card: dark?'rgba(255,255,255,.06)':'rgba(26,20,64,.05)',
      card2: dark?'rgba(255,255,255,.10)':'rgba(26,20,64,.09)',
      line: dark?'rgba(255,255,255,.12)':'rgba(26,20,64,.12)',
      text: dark?'#F5F3FF':'#1A1440', text2: dark?'#B9B3D9':'#4A4470', text3: dark?'#8E87B8':'#76709A' };
  } else { p=THEME_PRESETS[s.theme]||THEME_PRESETS.default; }
  { const map={ '--bg-1':p.bg1,'--bg-2':p.bg2,'--bg-3':p.bg3,'--card':p.card,'--card-2':p.card2,'--line':p.line,'--text':p.text,'--text-2':p.text2,'--text-3':p.text3 };
    Object.entries(map).forEach(([k,v])=>root.setProperty(k,v)); }
  root.setProperty('--select-bg', p.text);
  root.setProperty('--select-text', p.bg1);
  const dark = s.theme==='light' ? false : (s.theme==='custom' ? luminance(s.customBg||'#2A1B4A')<0.5 : true);
  root.setProperty('color-scheme', dark?'dark':'light');
}
function pushThemeHistory(hex){
  const s=Store.settings; let h=(s.themeHistory||[]).filter(x=>String(x).toLowerCase()!==String(hex).toLowerCase());
  h.unshift(hex); s.themeHistory=h.slice(0,5); Store.settings=s;
}
function applyCustomColor(hex){
  const s=Store.settings; s.theme='custom'; s.customBg=hex;
  s.themeHistory=(s.themeHistory||[]).filter(x=>String(x).toLowerCase()!==String(hex).toLowerCase());
  s.themeHistory.unshift(hex); s.themeHistory=s.themeHistory.slice(0,5);
  Store.settings=s; applyTheme(); renderSettings();
}

/* ---------- 路由 ---------- */
function applyStaticI18n(){
  const at=$('#app-title'); if(at) at.innerHTML=t('app.title')+'<span class="glow">'+t('app.titleGlow')+'</span>';
  const adText=$('.ad-text'), adHint=$('.ad-hint');
  if(adText) adText.textContent=t('ad.title');
  if(adHint) adHint.textContent=t('ad.hint');
  const sh=document.querySelector('#settings-mask .modal-head h3'); if(sh) sh.textContent=t('settings.title');
  const rb=$('#refresh-home'); if(rb){ const sp=rb.querySelector('svg'); rb.textContent=t('refresh'); if(sp) rb.prepend(sp); }
}
function router(){
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  if (parts[0] !== 'game') stopPoll();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));

  if (parts[0]==='league' && parts[1]){
    state.leagueTab = 'standings';
    $('#view-league').classList.add('active'); renderLeague(parts[1]);
  } else if (parts[0]==='game' && parts[1]){
    $('#view-game').classList.add('active'); renderGame(parts[1]);
  } else if (parts[0]==='rank'){
    $('#view-rank').classList.add('active'); renderRank(); renderNav('rank');
  } else if (parts[0]==='players'){
    $('#view-players').classList.add('active'); renderPlayers(); renderNav('players');
  } else if (parts[0]==='schedule'){
    $('#view-schedule').classList.add('active'); renderSchedule(); renderNav('schedule');
  } else if (parts[0]==='me'){
    $('#view-me').classList.add('active'); renderMe(); renderNav('me');
  } else {
    $('#view-home').classList.add('active'); renderHome();
  }
  /* 「我的」页隐藏广告位，其它视图保留测试卡片 */
  const adBar = $('#ad-bar');
  if (adBar) adBar.style.display = parts[0]==='me' ? 'none' : '';
  if (parts[0] !== 'me') scheduleAdFade();
  applyStaticI18n();
  window.scrollTo(0,0);
}
/* 测试广告卡：每次切换视图后常亮 8 秒，随后淡化至原透明度的 20% */
let adFadeTimer = null;
function scheduleAdFade(){
  const s = $('#ad-slot'); if(!s) return;
  s.classList.remove('ad-dim');
  if (adFadeTimer) clearTimeout(adFadeTimer);
  adFadeTimer = setTimeout(()=>s.classList.add('ad-dim'), 8000);
}

$('#ad-slot').addEventListener('click', ()=>{
  if (AD_SLOT.link){ window.open(AD_SLOT.link, '_blank'); } else { toast(t('ad.hint')); }
});
$('#open-settings').addEventListener('click', openSettings);
$('#settings-close').addEventListener('click', closeSettings);
$('#settings-mask').addEventListener('click', e=>{ if (e.target.id==='settings-mask') closeSettings(); });

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
applyTheme();
router();
</script>
